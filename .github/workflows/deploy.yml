name: Verificar publicación

# El deploy ya no se hace desde aquí. El VPS trae los cambios por su cuenta
# cada dos minutos (deploy/auto-pull.sh en cron), así que GitHub no necesita
# entrar por SSH al servidor.
#
# El motivo es de seguridad: la clave privada de deploy vivía en los secretos
# de este repositorio —que es público— y daba acceso root a un servidor con
# cuatro sitios. Al invertir la dirección del deploy, esa clave dejó de ser
# necesaria y se revocó.
#
# Este flujo ya no despliega: solo confirma que el sitio sigue en pie después
# de publicar. No usa secretos ni credenciales.

on:
  push:
    branches:
      - master

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a que el VPS tome los cambios
        run: sleep 150

      - name: Comprobar que el sitio responde
        run: |
          fallos=0
          for url in \
            "https://www.beristainyasociados.com.ar/" \
            "https://www.beristainyasociados.com.ar/penal.html" \
            "https://www.beristainyasociados.com.ar/civil.html" \
            "https://www.beristainyasociados.com.ar/contacto.html"
          do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 "$url" || echo "000")
            if [ "$codigo" = "200" ]; then
              echo "OK   $codigo  $url"
            else
              echo "FALLA $codigo  $url"
              fallos=$((fallos + 1))
            fi
          done
          if [ "$fallos" -gt 0 ]; then
            echo ""
            echo "$fallos página(s) no responden. Revisar el VPS."
            exit 1
          fi
          echo ""
          echo "El sitio responde correctamente."
