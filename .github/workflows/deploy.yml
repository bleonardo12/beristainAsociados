name: Deploy al VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      # REEMPLAZAMOS EL PASO ANTERIOR POR ESTE AGENTE OFICIAL
      - name: Configurar SSH Agent y Clave
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Registrar Host de Confianza
        run: |
          mkdir -p ~/.ssh
          # La clave del host va fija en lugar de escanearse en cada corrida.
          # ssh-keyscan fallaba de forma intermitente desde los runners de
          # GitHub (rangos de Azure hacia el VPS), y tumbaba el deploy antes
          # de intentar conectarse. Fijarla es además más seguro: evita
          # confiar en la primera clave que responda.
          # Si algún día se regeneran las claves del VPS, actualizar con:
          #   ssh-keyscan -4 -p 2222 -t ed25519 srv777726.hstgr.cloud
          cat >> ~/.ssh/known_hosts <<'EOF'
          [srv777726.hstgr.cloud]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDJwPDt8iTSLb1b3AV5fe/sH9p//IwBabyHIJiPNqYt3
          [69.62.95.98]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDJwPDt8iTSLb1b3AV5fe/sH9p//IwBabyHIJiPNqYt3
          EOF
          # El heredoc indentado agrega espacios al inicio; se limpian.
          sed -i 's/^[[:space:]]*//' ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "Host fijado:"
          cut -d' ' -f1 ~/.ssh/known_hosts

      - name: Deploy al VPS
        run: |
          # Ahora ya no necesitas pasarle el "-i", el agente la inyecta solo
          ssh -4 -p 2222 root@srv777726.hstgr.cloud << 'ENDSSH'
            set -e
            echo "📦 Iniciando deploy..."
            cd /var/www/beristainAsociados

            echo "🔄 Fetching cambios de master..."
            git fetch origin master

            echo "✨ Aplicando cambios..."
            git reset --hard origin/master

            echo "✅ Último commit desplegado:"
            git log -1 --oneline

            echo "🎉 Deploy completado exitosamente!"
          ENDSSH

      - name: Notificar resultado
        if: success()
        run: echo "✅ Deploy exitoso a srv777726.hstgr.cloud"