# =============================================================================
# Beristain & Asociados — fragmento de configuración Nginx
# =============================================================================
#
# NO reemplaces tu archivo de Nginx con este. Es un FRAGMENTO: copiá los bloques
# de abajo DENTRO del `server { ... }` que ya escucha en 443 para
# beristainyasociados.com.ar, sin tocar lo que ya tenés (SSL de Let's Encrypt,
# `root`, y el `location /api` que proxea al backend Node en el puerto 3000).
#
# Aplicar en el VPS:
#   ssh -p 2222 root@srv777726.hstgr.cloud
#   nano /etc/nginx/sites-available/beristainyasociados   # o el archivo que corresponda
#   nginx -t && systemctl reload nginx
#
# El sitio estático se sirve desde /var/www/beristainAsociados/frontend
# (el deploy lo actualiza GitHub Actions con `git reset --hard origin/master`).
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Forzar HTTPS  — server block aparte, en el puerto 80
# -----------------------------------------------------------------------------
# server {
#     listen 80;
#     listen [::]:80;
#     server_name beristainyasociados.com.ar www.beristainyasociados.com.ar;
#     return 301 https://www.beristainyasociados.com.ar$request_uri;
# }


# -----------------------------------------------------------------------------
# 2. Redirects 301 de las landings viejas de Google Ads
# -----------------------------------------------------------------------------
# ATENCIÓN antes de activar esto: las landings son hoy el destino de las campañas
# activas y llevan GTM (GTM-W6F4XTKN) con las conversiones de Google Ads
# (AW-11107730225). Las páginas nuevas sólo tienen GA4 (G-MLZ2VR5SYR). Si activás
# los redirects sin actualizar antes el lado Ads, la medición de conversiones de
# esas campañas se corta. Ver PENDIENTES-PUBLICACION.md.

location = /landing.html {
    if ($arg_area = penal) { return 301 /penal.html; }
    return 301 /penal.html;
}
location = /landing-civil.html    { return 301 /civil.html; }
location = /landing-contable.html { return 301 /contable.html; }

# Las otras dos landings NO están en las instrucciones. Descomentar sólo si se
# decide retirarlas también:
# location = /landing-societario.html { return 301 /societario.html; }
# location = /landing-accidentes.html { return 301 /civil.html; }

# Opcional: la política de privacidad vieja quedó reemplazada por privacidad.html.
# Descomentar para no dejar dos URLs con el mismo contenido indexadas:
# location = /politica-privacidad.html { return 301 /privacidad.html; }


# -----------------------------------------------------------------------------
# 3. Headers de seguridad — sitio nuevo (nivel server)
# -----------------------------------------------------------------------------
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google-analytics.com; connect-src 'self' https://*.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://*.googletagmanager.com https://www.googleadservices.com https://*.doubleclick.net https://www.google.com https://www.google.com.ar https://google.com.ar https://formsubmit.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.openstreetmap.org https://td.doubleclick.net https://www.googletagmanager.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://formsubmit.co" always;


# -----------------------------------------------------------------------------
# 4. Headers de seguridad — páginas heredadas (CSP más amplia)
# -----------------------------------------------------------------------------
# Las landings, el área de socios y honorarios usan GTM/Google Ads, Bootstrap
# Icons (jsDelivr), cdnjs y la API del backend. Con la CSP estricta de arriba se
# romperían, así que se les aplica una CSP propia.
#
# OJO con Nginx: un `add_header` dentro de un `location` ANULA todos los
# `add_header` heredados del server. Por eso este bloque repite los seis headers.

location ~ ^/(landing[a-z-]*|login|causas|presupuestos|honorarios|politica-privacidad)\.html$ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.googletagmanager.com https://www.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' https://beristainyasociados.com.ar https://*.google-analytics.com https://analytics.google.com https://*.googletagmanager.com https://googleads.g.doubleclick.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https: ; frame-src https://td.doubleclick.net https://www.googletagmanager.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
}


# -----------------------------------------------------------------------------
# 5. Caché de assets estáticos (opcional pero recomendado)
# -----------------------------------------------------------------------------
# El HTML NO debe cachearse de forma agresiva o los cambios tardan en verse.
location ~* \.(webp|jpg|jpeg|png|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}
location ~* \.(css|js)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
